# Prison - ColdMC's prison mines (world_prison). The mines themselves are in mines.yml,
# generated by knowledge/runtime/scripts/gen_prison.py; a cube re-marked in game with
# /prison setcube goes to overrides.yml and wins over mines.yml.

# A mining cube refills with a fresh random mix this often, or sooner once this share of it is mined.
reset-minutes: 10
reset-percent: 70
# Players standing in a cube when it refills are lifted to the prison's spawn first.

# Dungeon mobs. Every spawn-seconds, each prison with a player inside its box gets up to
# mobs-per-wave new mobs, until max-mobs + mobs-per-player x players are alive there.
spawn-seconds: 30
mobs-per-wave: 2
max-mobs: 4
mobs-per-player: 2
# A spawn wave is an elite (the theme's elemental) instead, this often:
elite-chance: 0.04
# Bosses: checked every boss-check-minutes in every occupied prison with no boss alive and none for
# boss-cooldown-minutes. They come by chance, and every boss-every-resets refills while players
# are there the prison's guardian wakes for certain.
boss-check-minutes: 5
boss-chance: 0.10
boss-cooldown-minutes: 45
boss-every-resets: 12
# A prison empty this long loses its mobs (bosses too), so idle prisons cost nothing.
despawn-after-seconds: 120

# Mining experience for ColdMC's own ores, which MMOCore's Mining profession does not list.
# Vanilla blocks are paid by MMOCore itself; blocks it does not list are in mines.yml extra-exp.
nexo-exp:
  silver_ore: 20
  silver_ore_deepslate: 24
  amethyst_ore: 20
  amethyst_ore_deepslate: 24
  mythril_ore: 35
  mythril_ore_deepslate: 42
  jade_ore: 45
  jade_ore_deepslate: 54
  ruby_ore: 55
  ruby_ore_deepslate: 66
  iridium_ore: 70
  iridium_ore_deepslate: 84
  raw_iridium_block: 80
  malachite_ore: 70
  malachite_ore_deepslate: 84
  amber_ore: 90
  amber_ore_deepslate: 108
  crystalite_ore: 110
  crystalite_nether_ore: 110
  crystalite_end_ore: 120
  palladium_ore: 140
  palladium_end_ore: 150
  bloodstone_ore: 140
  bloodstone_end_ore: 150
  galenite_ore: 140

messages:
  prefix: '&8[&dɢᴀɪᴀ&8] '
  reset: '&7The veins of &f%mine%&7 are restored.'
  lifted: '&7The mine closes over its veins; you are lifted clear.'
  boss: '&cSomething stirs in the depths of &f%mine%&c...'
  boss-title: '&4%boss%'
  elite: '&6An elemental answers the noise of your picks.'
